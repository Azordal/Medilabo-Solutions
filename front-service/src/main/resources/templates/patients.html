<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patients</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .add-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            text-decoration: none;
            border: 1px solid black;
            color: black;
            background-color: white;
            cursor: pointer;
        }

        .edit-button {
            display: inline-block;
            padding: 5px 10px;
            text-decoration: none;
            border: 1px solid black;
            color: black;
            margin-right: 5px;
        }

        .logout-form {
            margin: 0;
        }

        .logout-button {
            padding: 10px 15px;
            border: 1px solid black;
            background-color: white;
            color: black;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-button:hover,
        .add-button:hover,
        .edit-button:hover {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Liste des patients</h1>

    <form class="logout-form"
          th:action="@{/logout}"
          method="post">

        <button class="logout-button" type="submit">
            Se déconnecter
        </button>
    </form>
</div>

<a class="add-button" th:href="@{/patients/add}">
    Ajouter un patient
</a>

<table>
    <thead>
    <tr>
        <th>Id</th>
        <th>Prénom</th>
        <th>Nom</th>
        <th>Date de naissance</th>
        <th>Genre</th>
        <th>Adresse</th>
        <th>Téléphone</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="patient : ${patients}">
        <td th:text="${patient.id}"></td>
        <td th:text="${patient.firstName}"></td>
        <td th:text="${patient.lastName}"></td>
        <td th:text="${patient.birthDate}"></td>
        <td th:text="${patient.gender}"></td>
        <td th:text="${patient.address}"></td>
        <td th:text="${patient.phone}"></td>

        <td>
            <a class="edit-button"
               th:href="@{/patients/update/{id}(id=${patient.id})}">
                Modifier
            </a>

            <a class="edit-button"
               th:href="@{/patients/{id}/notes(id=${patient.id})}">
                Notes
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
