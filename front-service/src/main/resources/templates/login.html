<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Connexion - Medilabo Solutions</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            width: 350px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }

        .success {
            color: green;
            text-align: center;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <h2>Medilabo Solutions</h2>

    <div class="error" th:if="${param.error}">
        Nom d'utilisateur ou mot de passe incorrect.
    </div>

    <div class="success" th:if="${param.logout}">
        Vous avez été déconnecté avec succès.
    </div>

    <form th:action="@{/login}" method="post">

        <label for="username">Nom d'utilisateur</label>

        <input
                type="text"
                id="username"
                name="username"
                placeholder="Nom d'utilisateur"
                required>

        <label for="password">Mot de passe</label>

        <input
                type="password"
                id="password"
                name="password"
                placeholder="Mot de passe"
                required>

        <button type="submit">
            Se connecter
        </button>

    </form>

</div>

</body>

</html>
