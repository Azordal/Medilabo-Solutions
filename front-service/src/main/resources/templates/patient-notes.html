<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notes du patient</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .patient-info, .risk-info, .note-card, form {
            border: 1px solid black;
            padding: 15px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 8px;
        }

        button, a {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
        }

        .note-content {
            white-space: pre-wrap;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

<h1>Historique du patient</h1>

<div class="patient-info">
    <p><strong>Prénom :</strong> <span th:text="${patient.firstName}"></span></p>
    <p><strong>Nom :</strong> <span th:text="${patient.lastName}"></span></p>
    <p><strong>Date de naissance :</strong> <span th:text="${patient.birthDate}"></span></p>
    <p><strong>Genre :</strong> <span th:text="${patient.gender}"></span></p>
</div>

<div class="risk-info">
    <h2>Évaluation du risque de diabète</h2>
    <p><strong>Niveau de risque :</strong> <span th:text="${assessment.riskLevel}"></span></p>
</div>

<h2>Notes du médecin</h2>

<div th:if="${#lists.isEmpty(notes)}">
    <p>Aucune note pour ce patient.</p>
</div>

<div th:each="note : ${notes}" class="note-card">
    <p><strong>Date :</strong> <span th:text="${note.createdAt}"></span></p>
    <p class="note-content" th:text="${note.content}"></p>
</div>

<h2>Ajouter une note</h2>

<form th:action="@{/patients/{id}/notes(id=${patient.id})}"
      th:object="${note}"
      method="post">

    <textarea th:field="*{content}"
              placeholder="Saisir la note du médecin..."></textarea>

    <div class="error"
         th:if="${#fields.hasErrors('content')}"
         th:errors="*{content}">
    </div>

    <button type="submit">Ajouter la note</button>
</form>

<a th:href="@{/patients}">Retour à la liste des patients</a>

</body>
</html>
