services:

  mysql:
    image: mysql:8.0
    container_name: medilabo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: medilabo
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  mongodb:
    image: mongo:8.0
    container_name: medilabo-mongodb
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongodb-data:/data/db
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js

  patient-service:
    build: ./patient-service
    container_name: patient-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: root
    ports:
      - "8081:8081"
    depends_on:
      - mysql

  note-service:
    build: ./note-service
    container_name: note-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8083:8083"
    depends_on:
      - mongodb

  assessment-service:
    build: ./assessment-service
    container_name: assessment-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8084:8084"
    depends_on:
      - patient-service
      - note-service

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      - patient-service
      - note-service
      - assessment-service

  front-service:
    build: ./front-service
    container_name: front-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"
    depends_on:
      - gateway-service

volumes:
  mysql-data:
  mongodb-data: