spring.application.name=gateway-service

server.port=8080

spring.cloud.gateway.mvc.routes[0].id=patient-service
spring.cloud.gateway.mvc.routes[0].uri=http://patient-service:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/patients/**

spring.cloud.gateway.mvc.routes[1].id=note-service
spring.cloud.gateway.mvc.routes[1].uri=http://note-service:8083
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/notes/**

spring.cloud.gateway.mvc.routes[2].id=assessment-service
spring.cloud.gateway.mvc.routes[2].uri=http://assessment-service:8084
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/assessments/**