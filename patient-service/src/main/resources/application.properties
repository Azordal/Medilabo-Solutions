spring.application.name=patient-service

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/medilabo
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Identifiants utilisés pour sécuriser les appels vers le microservice
security.service.username=${SECURITY_USERNAME:medilabo-service}
security.service.password=${SECURITY_PASSWORD:medilabo-password}